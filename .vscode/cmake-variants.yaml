buildType:
  default: debug
  choices:
    debug:
      short: Debug
      long: Debugging build
      buildType: Debug
#      settings:
#        buildDirectory: ${workspaceFolder}/build.debug
    release:
      short: Release
      long: Optimised build for playing.
      buildType: Release
    master:
      short: Master
      long: |
        Before buggering SupSuper check if bug uncovered during fiddling exists in 'master'.
        !!!Need to manually checkout master before compiling!!!
      buildType: Debug


installType:
  default: user
  choices:
    user:
      short: UserSpace
      long: Install under '$HOME/.local'.
      settings:
        "CMAKE_INSTALL_PREFIX": ${userHome}/.local
