# Options.cpp
  R1DO_RESERVED_BEHAVIOR: "DEMO: Reserved items columns behavior"
  R1DO_RESERVED_BEHAVIOR_DESC: |
    Behavior of reserved items column for buy/sell/transfer screens:
    0: Do not use, 1: Claimed by soldiers, 2: Claimed by crafts/engineering/research, 3: Greedy (max of 1 and 2).
  R1DO_REVERSE_STATS_SEARCH: "TEST: Ammo statistics reverse search"
  R1DO_REVERSE_STATS_SEARCH_DESC: "Enables expensive reverse search for ammo statistics, which might not even be needed."
  R1DO_STYLE_CRAFTEQUIPMENTSTATE: "DEMO: R1do style craft equipment screen"
  R1DO_STYLE_CRAFTEQUIPMENTSTATE_DESC: |
    Always show claimed soldier items (using a separate column).
    Adds buttons operating on the whole (filtered) item list.
    Show craft item limits.
  R1DO_STYLE_SELLSTATE: "DEMO: R1do style sell screen"
  R1DO_STYLE_SELLSTATE_DESC: |
      Transfer items are valid sale targets by default.
      Adds buttons operating on the whole (filtered) item list.
      Always show reserved items (using a separate column).
      (hidden) note: Possibly obsoleted once item manager comes into play.
  R1DO_BASEINFO_DETAILS_SCREENS: "DEMO: Activate base info details screens"
  R1DO_BASEINFO_DETAILS_SCREENS_DESC: |
    Allow drill down into numbers behind overview.
    For the following screens: BaseInfo & MonthlyCosts
  R1DO_SHOW_ALL_ACTIVE_RADAR_CIRCLES: "DEMO: Show radar circles for all active facilities."
  R1DO_SHOW_ALL_ACTIVE_RADAR_CIRCLES_DESC: |
    Shows a unique radar circle for each radar active on a base.
